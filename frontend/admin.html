<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-tech | Админ панель</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #191C29;
      --bg2: #11182B;
      --bg3: #1e2438;
      --accent: #01C38D;
      --accent-dim: rgba(1,195,141,0.12);
      --border: rgba(255,255,255,0.07);
      --text: #ffffff;
      --text-dim: #8f96a8;
      --red: #ff5a5a;
      --yellow: #f5c518;
      --blue: #4a9eff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-logo .logo-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: var(--bg);
    }

    .sidebar-logo span {
      font-size: 16px; font-weight: 700;
      color: var(--text);
    }

    .sidebar-logo small {
      display: block;
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); }

    .nav-item .icon { font-size: 18px; width: 22px; text-align: center; }

    .sidebar-footer {
      padding: 16px 12px;
      border-top: 1px solid var(--border);
    }

    .admin-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg3);
      border-radius: 12px;
    }

    .admin-avatar {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--bg);
      flex-shrink: 0;
    }

    .admin-info { flex: 1; min-width: 0; }
    .admin-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-role { font-size: 11px; color: var(--accent); }

    /* MAIN */
    .main {
      margin-left: 240px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(25,28,41,0.92);
      backdrop-filter: blur(18px);
      position: sticky; top: 0; z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar-actions { display: flex; gap: 10px; }

    .content { padding: 32px; flex: 1; }

    /* LOGIN */
    #login-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 400px;
    }

    .login-card h2 { font-size: 24px; margin-bottom: 8px; }
    .login-card p { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }

    .form-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus { border-color: var(--accent); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px; font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; border: none; transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: var(--bg); width: 100%; padding: 14px; font-size: 15px; }
    .btn-primary:hover { background: #00a87a; }
    .btn-danger { background: rgba(255,90,90,0.12); color: var(--red); }
    .btn-danger:hover { background: rgba(255,90,90,0.2); }
    .btn-secondary { background: var(--bg3); color: var(--text); }
    .btn-secondary:hover { background: #2a3050; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
    .btn-accent { background: var(--accent-dim); color: var(--accent); }
    .btn-accent:hover { background: rgba(1,195,141,0.2); }

    .login-error { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; display: none; }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
    }

    .stat-label { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--text); }
    .stat-accent { color: var(--accent); }

    /* TABLE */
    .table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-header h3 { font-size: 16px; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; }

    th {
      padding: 12px 20px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    td {
      padding: 14px 20px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .product-thumb {
      width: 40px; height: 40px;
      object-fit: contain;
      border-radius: 8px;
      background: var(--bg3);
    }

    .product-cell { display: flex; align-items: center; gap: 12px; }
    .product-name { font-weight: 500; }
    .product-brand { font-size: 12px; color: var(--text-dim); }

    .badge {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }

    .badge-hit { background: rgba(245,197,24,0.15); color: var(--yellow); }
    .badge-new { background: rgba(74,158,255,0.15); color: var(--blue); }
    .badge-sale { background: rgba(255,90,90,0.15); color: var(--red); }
    .badge-created { background: rgba(74,158,255,0.15); color: var(--blue); }
    .badge-processing { background: rgba(245,197,24,0.15); color: var(--yellow); }
    .badge-delivery { background: rgba(1,195,141,0.15); color: var(--accent); }
    .badge-delivered { background: rgba(1,195,141,0.25); color: var(--accent); }
    .badge-cancelled { background: rgba(255,90,90,0.15); color: var(--red); }
    .badge-admin { background: rgba(1,195,141,0.15); color: var(--accent); }
    .badge-user { background: var(--bg3); color: var(--text-dim); }

    .actions { display: flex; gap: 8px; }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      width: 560px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h3 { font-size: 18px; margin-bottom: 24px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .modal-footer {
      display: flex; gap: 12px; justify-content: flex-end;
      margin-top: 24px; padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    select.form-input {
      appearance: none;
      cursor: pointer;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-dim);
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center; padding: 60px;
      color: var(--text-dim); font-size: 14px;
    }

    .top-products { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

    .top-product-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--bg3);
      border-radius: 12px;
    }

    .top-product-rank {
      width: 24px; height: 24px;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }

    .top-product-name { flex: 1; font-size: 13px; }
    .top-product-qty { font-size: 13px; color: var(--accent); font-weight: 600; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 14px;
      z-index: 9999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--accent); color: var(--accent); }
    .toast.error { border-color: var(--red); color: var(--red); }

    /* STATUS SELECT */
    .status-select {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      outline: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h2>Добро пожаловать</h2>
    <p>Войдите в аккаунт администратора</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" class="form-input" id="login-email" placeholder="admin@q-tech.com">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" class="form-input" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Войти</button>
    <div class="login-error" id="login-error">Неверный email или пароль</div>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">Q</div>
    <div>
      <span>Q-tech</span>
      <small>Admin Panel</small>
    </div>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" onclick="showTab('dashboard')" id="nav-dashboard">
      <span class="icon">📊</span> Дашборд
    </button>
    <button class="nav-item" onclick="showTab('products')" id="nav-products">
      <span class="icon">📦</span> Товары
    </button>
    <button class="nav-item" onclick="showTab('orders')" id="nav-orders">
      <span class="icon">🛒</span> Заказы
    </button>
    <button class="nav-item" onclick="showTab('users')" id="nav-users">
      <span class="icon">👥</span> Пользователи
    </button>
  </nav>
  <div class="sidebar-footer">
    <div class="admin-badge">
      <div class="admin-avatar" id="admin-avatar">A</div>
      <div class="admin-info">
        <div class="admin-name" id="admin-name">Администратор</div>
        <div class="admin-role">Admin</div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main-app" style="display:none">
  <div class="topbar">
    <h1 id="page-title">Дашборд</h1>
    <div class="topbar-actions">
      <button class="btn btn-danger btn-sm" onclick="logout()">Выйти</button>
    </div>
  </div>
  <div class="content">

    <!-- DASHBOARD -->
    <div id="tab-dashboard">
      <div class="stats-grid" id="stats-grid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
      <div class="table-wrap">
        <div class="table-header"><h3>Топ товаров</h3></div>
        <div class="top-products" id="top-products" style="padding:16px"></div>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div id="tab-products" class="hidden">
      <div class="table-wrap">
        <div class="table-header">
          <h3>Товары</h3>
          <button class="btn btn-accent btn-sm" onclick="openProductModal()">+ Добавить</button>
        </div>
        <div id="products-table"><div class="loading"><div class="spinner"></div></div></div>
      </div>
    </div>

    <!-- ORDERS -->
    <div id="tab-orders" class="hidden">
      <div class="table-wrap">
        <div class="table-header"><h3>Заказы</h3></div>
        <div id="orders-table"><div class="loading"><div class="spinner"></div></div></div>
      </div>
    </div>

    <!-- USERS -->
    <div id="tab-users" class="hidden">
      <div class="table-wrap">
        <div class="table-header"><h3>Пользователи</h3></div>
        <div id="users-table"><div class="loading"><div class="spinner"></div></div></div>
      </div>
    </div>

  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <h3 id="product-modal-title">Добавить товар</h3>
    <input type="hidden" id="product-id">
    <div class="form-row">
      <div class="form-group">
        <label>Название</label>
        <input type="text" class="form-input" id="p-title" placeholder="Apple iPhone 15">
      </div>
      <div class="form-group">
        <label>Бренд</label>
        <input type="text" class="form-input" id="p-brand" placeholder="Apple">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Категория</label>
        <select class="form-input" id="p-category">
          <option value="smartphones">Смартфоны</option>
          <option value="laptops">Ноутбуки</option>
          <option value="headphones">Наушники</option>
          <option value="smartwatches">Умные часы</option>
          <option value="vacuums">Пылесосы</option>
          <option value="hairdryers">Фены</option>
        </select>
      </div>
      <div class="form-group">
        <label>Бейдж</label>
        <select class="form-input" id="p-badge">
          <option value="">Нет</option>
          <option value="hit">Хит</option>
          <option value="new">Новинка</option>
          <option value="sale">Скидка</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Цена (₽)</label>
        <input type="number" class="form-input" id="p-price" placeholder="99990">
      </div>
      <div class="form-group">
        <label>Старая цена (₽)</label>
        <input type="number" class="form-input" id="p-old-price" placeholder="119990">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Рейтинг (0-5)</label>
        <input type="number" class="form-input" id="p-rating" placeholder="4.5" min="0" max="5" step="0.1">
      </div>
      <div class="form-group">
        <label>Отзывы</label>
        <input type="number" class="form-input" id="p-reviews" placeholder="128">
      </div>
    </div>
    <div class="form-group">
      <label>Описание</label>
      <input type="text" class="form-input" id="p-description" placeholder="Краткое описание товара">
    </div>
    <div class="form-group">
      <label>Ссылка на изображение</label>
      <input type="text" class="form-input" id="p-image" placeholder="https://...">
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeProductModal()">Отмена</button>
      <button class="btn btn-primary" style="width:auto;padding:12px 24px" onclick="saveProduct()">Сохранить</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const API = 'https://q-tech-new-production.up.railway.app';
  let token = localStorage.getItem('access_token');
  let currentAdmin = null;

  // ── AUTH ──

  async function doLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const err = document.getElementById('login-error');
    err.style.display = 'none';

    try {
      const res = await fetch(`${API}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail);

      // Проверяем что это админ
      const meRes = await fetch(`${API}/api/users/me`, {
        headers: { 'Authorization': `Bearer ${data.access_token}` }
      });
      const me = await meRes.json();

      // Проверяем через admin endpoint
      const checkRes = await fetch(`${API}/api/admin/stats`, {
        headers: { 'Authorization': `Bearer ${data.access_token}` }
      });

      if (checkRes.status === 403) {
        err.textContent = 'У вас нет прав администратора';
        err.style.display = 'block';
        return;
      }

      token = data.access_token;
      localStorage.setItem('admin_token', token);
      currentAdmin = me;

      document.getElementById('admin-name').textContent = me.name;
      document.getElementById('admin-avatar').textContent = me.name[0].toUpperCase();

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
      loadDashboard();

    } catch(e) {
      err.textContent = e.message || 'Ошибка входа';
      err.style.display = 'block';
    }
  }

  function logout() {
    localStorage.removeItem('access_token');
    token = null;
    location.reload();
  }

  // ── TABS ──

  function showTab(name) {
    ['dashboard','products','orders','users'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.add('hidden');
      document.getElementById(`nav-${t}`).classList.remove('active');
    });
    document.getElementById(`tab-${name}`).classList.remove('hidden');
    document.getElementById(`nav-${name}`).classList.add('active');

    const titles = { dashboard: 'Дашборд', products: 'Товары', orders: 'Заказы', users: 'Пользователи' };
    document.getElementById('page-title').textContent = titles[name];

    if (name === 'dashboard') loadDashboard();
    if (name === 'products') loadProducts();
    if (name === 'orders') loadOrders();
    if (name === 'users') loadUsers();
  }

  // ── API HELPER ──

  async function api(path, method = 'GET', body = null) {
    const opts = {
      method,
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(`${API}${path}`, opts);
    if (!res.ok) throw new Error((await res.json()).detail);
    return res.json();
  }

  // ── DASHBOARD ──

  async function loadDashboard() {
    try {
      const stats = await api('/api/admin/stats');
      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Всего заказов</div>
          <div class="stat-value">${stats.total_orders}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Выручка</div>
          <div class="stat-value stat-accent">${Number(stats.total_revenue).toLocaleString('ru-RU')} ₽</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Пользователей</div>
          <div class="stat-value">${stats.total_users}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Товаров</div>
          <div class="stat-value">${stats.total_products}</div>
        </div>
      `;

      const topEl = document.getElementById('top-products');
      if (stats.top_products.length === 0) {
        topEl.innerHTML = '<div class="empty-state">Нет данных</div>';
      } else {
        topEl.innerHTML = stats.top_products.map((p, i) => `
          <div class="top-product-item">
            <div class="top-product-rank">${i+1}</div>
            <div class="top-product-name">${p.title}</div>
            <div class="top-product-qty">${p.qty} шт.</div>
          </div>
        `).join('');
      }
    } catch(e) {
      showToast('Ошибка загрузки статистики', 'error');
    }
  }

  // ── PRODUCTS ──

  async function loadProducts() {
    document.getElementById('products-table').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      const products = await api('/api/admin/products');
      if (products.length === 0) {
        document.getElementById('products-table').innerHTML = '<div class="empty-state">Нет товаров</div>';
        return;
      }
      document.getElementById('products-table').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Товар</th>
              <th>Категория</th>
              <th>Цена</th>
              <th>Бейдж</th>
              <th>В наличии</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody>
            ${products.map(p => `
              <tr>
                <td>
                  <div class="product-cell">
                    <img src="${p.images?.[0] || ''}" class="product-thumb" onerror="this.style.display='none'">
                    <div>
                      <div class="product-name">${p.title}</div>
                      <div class="product-brand">${p.brand}</div>
                    </div>
                  </div>
                </td>
                <td>${p.category}</td>
                <td>${Number(p.price).toLocaleString('ru-RU')} ₽</td>
                <td>${p.badge ? `<span class="badge badge-${p.badge}">${p.badge}</span>` : '—'}</td>
                <td>${p.in_stock ? '✅' : '❌'}</td>
                <td>
                  <div class="actions">
                    <button class="btn btn-accent btn-sm" onclick="editProduct(${p.id})">✏️</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">🗑️</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch(e) {
      showToast('Ошибка загрузки товаров', 'error');
    }
  }

  let productsCache = [];

  function openProductModal(product = null) {
    document.getElementById('product-modal-title').textContent = product ? 'Редактировать товар' : 'Добавить товар';
    document.getElementById('product-id').value = product?.id || '';
    document.getElementById('p-title').value = product?.title || '';
    document.getElementById('p-brand').value = product?.brand || '';
    document.getElementById('p-category').value = product?.category || 'smartphones';
    document.getElementById('p-badge').value = product?.badge || '';
    document.getElementById('p-price').value = product?.price || '';
    document.getElementById('p-old-price').value = product?.old_price || '';
    document.getElementById('p-rating').value = product?.rating || '';
    document.getElementById('p-reviews').value = product?.reviews || '';
    document.getElementById('p-description').value = product?.description || '';
    document.getElementById('p-image').value = product?.images?.[0] || '';
    document.getElementById('product-modal').classList.add('open');
  }

  function closeProductModal() {
    document.getElementById('product-modal').classList.remove('open');
  }

  async function editProduct(id) {
    try {
      const products = await api('/api/admin/products');
      const p = products.find(x => x.id === id);
      if (p) openProductModal(p);
    } catch(e) { showToast('Ошибка', 'error'); }
  }

  async function saveProduct() {
    const id = document.getElementById('product-id').value;
    const image = document.getElementById('p-image').value;
    const data = {
      title: document.getElementById('p-title').value,
      brand: document.getElementById('p-brand').value,
      category: document.getElementById('p-category').value,
      badge: document.getElementById('p-badge').value || null,
      price: parseInt(document.getElementById('p-price').value),
      old_price: parseInt(document.getElementById('p-old-price').value) || null,
      rating: parseFloat(document.getElementById('p-rating').value) || 0,
      reviews: parseInt(document.getElementById('p-reviews').value) || 0,
      description: document.getElementById('p-description').value,
      images: image ? [image] : [],
      in_stock: true
    };

    try {
      if (id) {
        await api(`/api/admin/products/${id}`, 'PUT', data);
        showToast('Товар обновлён', 'success');
      } else {
        await api('/api/admin/products', 'POST', data);
        showToast('Товар добавлен', 'success');
      }
      closeProductModal();
      loadProducts();
      loadDashboard();
    } catch(e) {
      showToast('Ошибка сохранения: ' + e.message, 'error');
    }
  }

  async function deleteProduct(id) {
    if (!confirm('Удалить товар?')) return;
    try {
      await api(`/api/admin/products/${id}`, 'DELETE');
      showToast('Товар удалён', 'success');
      loadProducts();
      loadDashboard();
    } catch(e) {
      showToast('Ошибка удаления', 'error');
    }
  }

  // ── ORDERS ──

  const statusLabels = {
    created: 'Новый',
    processing: 'В обработке',
    delivery: 'Доставляется',
    delivered: 'Доставлен',
    cancelled: 'Отменён'
  };

  async function loadOrders() {
    document.getElementById('orders-table').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      const orders = await api('/api/admin/orders');
      if (orders.length === 0) {
        document.getElementById('orders-table').innerHTML = '<div class="empty-state">Нет заказов</div>';
        return;
      }
      document.getElementById('orders-table').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Номер</th>
              <th>Покупатель</th>
              <th>Сумма</th>
              <th>Дата</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody>
            ${orders.map(o => `
              <tr>
                <td><strong>${o.order_number}</strong></td>
                <td>
                  <div>${o.user?.name || '—'}</div>
                  <div style="font-size:12px;color:var(--text-dim)">${o.user?.email || ''}</div>
                </td>
                <td><strong style="color:var(--accent)">${Number(o.total_amount).toLocaleString('ru-RU')} ₽</strong></td>
                <td style="font-size:13px;color:var(--text-dim)">${new Date(o.created_at).toLocaleDateString('ru-RU')}</td>
                <td>
                  <select class="status-select" onchange="updateOrderStatus(${o.id}, this.value)">
                    ${Object.entries(statusLabels).map(([val, label]) =>
                      `<option value="${val}" ${o.status === val ? 'selected' : ''}>${label}</option>`
                    ).join('')}
                  </select>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch(e) {
      showToast('Ошибка загрузки заказов', 'error');
    }
  }

  async function updateOrderStatus(id, status) {
    try {
      await api(`/api/admin/orders/${id}`, 'PUT', { status });
      showToast('Статус обновлён', 'success');
    } catch(e) {
      showToast('Ошибка обновления', 'error');
    }
  }

  // ── USERS ──

  async function loadUsers() {
    document.getElementById('users-table').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      const users = await api('/api/admin/users');
      if (users.length === 0) {
        document.getElementById('users-table').innerHTML = '<div class="empty-state">Нет пользователей</div>';
        return;
      }
      document.getElementById('users-table').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Имя</th>
              <th>Email</th>
              <th>Роль</th>
              <th>Дата регистрации</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td><strong>${u.name}</strong></td>
                <td style="color:var(--text-dim)">${u.email}</td>
                <td><span class="badge ${u.is_admin ? 'badge-admin' : 'badge-user'}">${u.is_admin ? 'Админ' : 'Пользователь'}</span></td>
                <td style="font-size:13px;color:var(--text-dim)">${new Date(u.created_at).toLocaleDateString('ru-RU')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch(e) {
      showToast('Ошибка загрузки пользователей', 'error');
    }
  }

  // ── TOAST ──

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── INIT ──

  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // Проверяем сохранённый токен
  if (token) {
    fetch(`${API}/api/admin/stats`, {
      headers: { 'Authorization': `Bearer ${token}` }
    }).then(async res => {
      if (res.ok) {
        const me = await fetch(`${API}/api/users/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(r => r.json());
        currentAdmin = me;
        document.getElementById('admin-name').textContent = me.name;
        document.getElementById('admin-avatar').textContent = me.name[0].toUpperCase();
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        loadDashboard();
      } else {
        localStorage.removeItem('admin_token');
        token = null;
      }
    });
  }
</script>
</body>
</html>
